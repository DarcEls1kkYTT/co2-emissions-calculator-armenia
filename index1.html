<!DOCTYPE html>
<html lang="hy">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CO2 Արտանետումների Հաշվիչ - Հայաստան</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f0f8f0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            color: #2c3e50;
        }
        .container {
            background: white;
            padding: 2rem;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            max-width: 500px;
            width: 100%;
            text-align: center;
        }
        h1 {
            color: #27ae60;
            margin-bottom: 1.5rem;
            font-size: 1.8rem;
        }
        .input-group {
            margin-bottom: 1.5rem;
            text-align: left;
        }
        label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: bold;
        }
        input {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 1rem;
            box-sizing: border-box;
            transition: border-color 0.3s;
        }
        input:focus {
            border-color: #27ae60;
            outline: none;
        }
        .results {
            margin-top: 2rem;
            padding-top: 1.5rem;
            border-top: 2px solid #f0f0f0;
            display: none;
        }
        .result-item {
            margin-bottom: 1rem;
            font-size: 1.1rem;
        }
        .highlight {
            font-weight: bold;
            color: #e67e22;
            font-size: 1.3rem;
        }
        .tree-icon {
            font-size: 2rem;
            margin-top: 0.5rem;
        }
        .info-box {
            margin-top: 2rem;
            font-size: 0.85rem;
            color: #7f8c8d;
            text-align: left;
            background: #f9f9f9;
            padding: 1rem;
            border-radius: 8px;
            line-height: 1.4;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>CO2 Հաշվիչ (Հայաստան)</h1>
        
        <div class="input-group">
            <label for="kwh">Մուտքագրեք էլեկտրաէներգիայի սպառումը (ԿՎտ*ժ)</label>
            <input type="number" id="kwh" placeholder="Օրինակ՝ 1" min="0" step="0.1" oninput="calculate()">
        </div>

        <div id="results" class="results">
            <div class="result-item">
                Արտանետված CO2-ի քանակը:<br>
                <span id="co2-result" class="highlight">0</span> գրամ
            </div>
            <div class="result-item">
                Անհրաժեշտ հասուն ծառերի քանակը (1 օրվա համար):<br>
                <span id="trees-result" class="highlight">0</span> ծառ
            </div>
            <div id="tree-icons" class="tree-icon"></div>
        </div>

        <div class="info-box">
            <strong>Գիտական տվյալներ:</strong><br>
            • 1 ԿՎտ*ժ-ն Հայաստանում արտանետում է մոտ 250գ CO2:<br>
            • 1 հասուն ծառը օրական կլանում է մոտ 60գ CO2:<br>
            • 100Վտ հզորությամբ լամպը 10 ժամում սպառում է 1 ԿՎտ*ժ:
        </div>
    </div>

    <script>
        function calculate() {
            const kwh = document.getElementById('kwh').value;
            const resultsDiv = document.getElementById('results');
            const co2Res = document.getElementById('co2-result');
            const treesRes = document.getElementById('trees-result');
            const treeIcons = document.getElementById('tree-icons');

            if (kwh > 0) {
                resultsDiv.style.display = 'block';
                
                // 1 kWh = 250g CO2
                const co2 = kwh * 250;
                // 1 tree absorbs 60g CO2 per day
                const trees = Math.floor(co2 / 60);
co2Res.innerText = co2.toLocaleString();
                treesRes.innerText = trees.toLocaleString();

                let icons = '';
                const displayTrees = Math.min(trees, 50);
                for(let i=0; i<displayTrees; i++) {
                    icons += '🌳';
                }
                if (trees > 50) icons += '...';
                treeIcons.innerHTML = icons;
            } else {
                resultsDiv.style.display = 'none';
            }
        }
    </script>
</body>
</html>
